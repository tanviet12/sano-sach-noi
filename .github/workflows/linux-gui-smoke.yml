name: Linux GUI smoke

# Chạy tay: Sano AppImage thật (tải từ Releases) trên Xvfb, bấm chuột bằng
# xdotool (tọa độ theo cửa sổ 1100×720), chụp màn hình từng bước (Artifacts).
# play: mở sách mẫu, bấm Phát. update: bản cũ → Cập nhật ngay → Khởi động lại,
# kiểm SHA256 AppImage sau khi thay khớp bản mới. Đổi bố cục giao diện thì xem
# ảnh chụp rồi chỉnh tọa độ trong scripts/ci/linux-gui-smoke.sh.
# 25/09/2026: 0.1.4 phát được; 0.1.3 → 0.1.4 tự cập nhật đạt.
on:
  workflow_dispatch:
    inputs:
      new:
        description: "Bản phát hành để thử phát / đích cập nhật"
        default: "0.1.4"
      old:
        description: "Bản cũ để thử tự cập nhật"
        default: "0.1.3"

permissions:
  contents: read

jobs:
  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEW: ${{ inputs.new || '0.1.4' }}
      OLD: ${{ inputs.old || '0.1.3' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cài màn hình ảo + WebKitGTK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xdotool imagemagick pulseaudio libwebkit2gtk-4.1-0 ffmpeg
      - name: Tải AppImage
        run: |
          gh release download "v$NEW" --repo "$GITHUB_REPOSITORY" -p "Sano-$NEW-linux-amd64.AppImage" -p SHA256SUMS -D new
          gh release download "v$OLD" --repo "$GITHUB_REPOSITORY" -p "Sano-$OLD-linux-amd64.AppImage" -D old
          chmod +x new/*.AppImage old/*.AppImage
          echo "WANT=$(grep "Sano-$NEW-linux-amd64.AppImage" new/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Xvfb + loa giả
        run: |
          Xvfb :99 -screen 0 1100x720x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1 || true
          sleep 2
      - name: Phát sách mẫu
        run: scripts/ci/linux-gui-smoke.sh play "new/Sano-$NEW-linux-amd64.AppImage" shots/play
      - name: Tự cập nhật từ bản cũ
        if: always()
        run: scripts/ci/linux-gui-smoke.sh update "old/Sano-$OLD-linux-amd64.AppImage" shots/update "$WANT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-gui-smoke
          path: shots
          retention-days: 7

name: Desktop build + release

# Build phần mềm desktop (Wails) cho Windows, macOS, Linux.
#
# - Gắn thẻ vX.Y.Z (hoặc vX.Y.Z-beta.N) → build 3 hệ điều hành, đóng gói
#   (.exe bộ cài + .zip chạy ngay, .dmg, .AppImage), SHA256SUMS + chữ ký
#   ed25519 SHA256SUMS.sig (app kiểm trước khi tự cập nhật), attestation
#   nguồn gốc build, tạo GitHub Release dạng NHÁP (người vận hành tự bấm Publish).
# - Run workflow (workflow_dispatch) → build thử 3 hệ điều hành, tải file ở mục
#   Artifacts của lần chạy, KHÔNG tạo release (tick "Quét VirusTotal" để thử quét).
# - Pull request / push vào main có đụng mã desktop → build + đóng gói Linux và
#   Windows để bắt lỗi sớm (bỏ macOS cho đỡ tốn phút: máy Mac tính gấp 10 lần).
#
# Chưa ký số Windows/Apple, không notarize (chưa có chứng chỉ). Secret ngoài
# GITHUB_TOKEN: SANO_UPDATE_SIGNING_KEY (khoá ed25519 ký SHA256SUMS, chỉ dùng ở
# job release — tạo bằng scripts/release/update-key.sh) và VT_API_KEY (quét
# VirusTotal, chỉ dùng ở job virustotal). Mọi action ghim theo SHA commit.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: &build_paths
      - 'desktop/**'
      - 'docs/dieu-khoan-su-dung.md'
      - 'docs/prompts/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/release/**'
      - 'scripts/tts/**'
      - '.github/workflows/desktop-release.yml'
  pull_request:
    branches: [main]
    paths: *build_paths
  workflow_dispatch:
    inputs:
      virustotal:
        description: "Quét VirusTotal các bản build thử"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  meta:
    name: Phiên bản + ma trận
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          release=false
          if [[ "$EVENT" == "push" && "$REF" == refs/tags/v* ]]; then
            version="${REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::thẻ '$REF_NAME' không đúng dạng vX.Y.Z hoặc vX.Y.Z-beta.N"
              exit 1
            fi
            release=true
          else
            version="0.0.0-dev.${SHA::7}"
          fi
          mac='{"os":"macos-14","target":"macos","platform":"darwin/universal","arch":"universal"}'
          win='{"os":"windows-latest","target":"windows","platform":"windows/amd64","arch":"amd64"}'
          lin='{"os":"ubuntu-22.04","target":"linux","platform":"linux/amd64","arch":"amd64"}'
          if [[ "$EVENT" == "pull_request" || ( "$EVENT" == "push" && "$release" == "false" ) ]]; then
            matrix="{\"include\":[$win,$lin]}"
          else
            matrix="{\"include\":[$mac,$win,$lin]}"
          fi
          {
            echo "version=$version"
            echo "release=$release"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "Phiên bản: $version · phát hành: $release"

  gate:
    name: Gate (go vet + go test)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Thư viện GTK/WebKit (desktop cần CGO)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Module gốc
        run: |
          go vet ./...
          go test ./internal/... -count=1
      - name: Module desktop
        working-directory: desktop
        run: |
          go vet -tags webkit2_41 ./...
          go test -tags webkit2_41 ./... -count=1

  build:
    name: Build ${{ matrix.target }}
    needs: [meta, gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Thư viện GTK/WebKit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: NSIS (Windows, tạo bộ cài)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
              choco install nsis --version=3.11 -y --no-progress
            }
            Add-Content -Path $env:GITHUB_PATH -Value $nsis
          }

      - name: Wails CLI (đúng phiên bản trong desktop/go.mod)
        run: |
          wv="$(cd desktop && go list -m -f "{{.Version}}" github.com/wailsapp/wails/v2)"
          test -n "$wv"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wv"
          wails version

      - name: Cài thư viện giao diện
        working-directory: desktop/frontend
        run: npm ci --no-audit --no-fund

      - name: Build
        run: scripts/release/build.sh "$VERSION" "${{ matrix.platform }}"

      - name: Đóng gói
        run: scripts/release/package-${{ matrix.target }}.sh "$VERSION" "${{ matrix.arch }}"

      # Tự cập nhật trên Windows (P3-7): phần Go chỉ chạy được trên máy Windows
      # thật, và bộ cài NSIS đã sửa phải đợi Sano thoát rồi mới chép, cài xong
      # mở lại Sano (/sano-mo-lai). Thư mục cài có dấu cách để thử /D= không ngoặc.
      - name: Thử tự cập nhật (Go, Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: go test -count=1 -run 'WinInstall|SetupCmdLine|ApplyUpdate_Portable|ExtractExe|VerifySums|SumFor|PlanUpdate|RunUpdateDownload|OldPID|ProcessAlive' .
      - name: Thử cài đè im lặng khi Sano đang chạy (bộ cài NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem desktop/build/bin/release/*-setup.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'Sano Thu Cap Nhat'
          $exe = Join-Path $dir 'Sano.exe'
          $p = Start-Process -FilePath $setup -ArgumentList "/S /D=$dir" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path $exe)) { throw "cài lần đầu hỏng (mã $($p.ExitCode))" }
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw 'Sano không chạy được sau khi cài' }
          # Đúng dòng lệnh app dùng (setupCmdLine): bộ cài phải đợi Sano thoát.
          $inst = Start-Process -FilePath $setup -ArgumentList "/S /sano-mo-lai /D=$dir" -PassThru
          Start-Sleep -Seconds 4
          if ($inst.HasExited) { throw "bộ cài không đợi Sano thoát (mã $($inst.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          if (-not $inst.WaitForExit(60000)) { throw 'bộ cài treo sau khi Sano thoát' }
          if ($inst.ExitCode -ne 0) { throw "bộ cài trả mã $($inst.ExitCode)" }
          $new = $null
          foreach ($i in 1..20) {
            $new = Get-Process Sano -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe -and $_.Id -ne $app.Id }
            if ($new) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $new) { throw 'cài xong không tự mở lại Sano' }
          Write-Host "Đạt: bộ cài đợi Sano thoát, cài đè, mở lại Sano (pid $($new.Id))"
          $new | Stop-Process -Force
          Start-Sleep -Seconds 2
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sano-${{ matrix.target }}-${{ matrix.arch }}
          path: desktop/build/bin/release/*
          if-no-files-found: error
          retention-days: 14

  # Quét VirusTotal (P3-12): kết quả + link đưa vào ghi chú release. Có phần
  # mềm báo nhiễm chỉ cảnh báo; VirusTotal lỗi / chậm cũng không chặn phát hành.
  virustotal:
    name: Quét VirusTotal
    needs: [meta, build]
    if: needs.meta.outputs.release == 'true' || (github.event_name == 'workflow_dispatch' && inputs.virustotal)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sano-*
          path: dist
          merge-multiple: true
      - name: Quét
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          scripts/release/virustotal.sh dist > virustotal.md
          cat virustotal.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virustotal
          path: virustotal.md
          retention-days: 14

  release:
    name: GitHub Release (nháp)
    needs: [meta, build, virustotal]
    # virustotal hỏng hay bị bỏ qua vẫn tạo release (build phải đạt).
    if: ${{ !cancelled() && needs.meta.outputs.release == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # tạo release nháp + đính file
      id-token: write      # attestation nguồn gốc build
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sano-*
          path: dist
          merge-multiple: true
      - name: Kết quả VirusTotal (nếu có)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: virustotal
          path: ${{ runner.temp }}/vt

      - name: SHA256SUMS
        run: scripts/release/checksums.sh dist

      # App chỉ tự cập nhật lên bản có chữ ký đúng khoá nhúng trong app;
      # sign.sh kiểm lại chữ ký bằng khoá trong desktop/updatekey.go.
      - name: Ký SHA256SUMS (ed25519)
        env:
          SANO_UPDATE_SIGNING_KEY: ${{ secrets.SANO_UPDATE_SIGNING_KEY }}
        run: scripts/release/sign.sh dist

      # Attestation miễn phí cho repo công khai; repo riêng tư cần gói GitHub
      # Enterprise Cloud → bỏ qua cho tới khi repo công khai.
      - name: Attestation nguồn gốc build
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/Sano-*
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
      - name: Nhắc khi bỏ qua attestation
        if: ${{ github.event.repository.private }}
        run: echo "::warning::Repo đang riêng tư — bỏ qua attestation (chỉ miễn phí cho repo công khai)."

      - name: Tạo release nháp
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release/notes.sh "$VERSION" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          if [[ -s "$RUNNER_TEMP/vt/virustotal.md" ]]; then
            { echo; cat "$RUNNER_TEMP/vt/virustotal.md"; } >> "$RUNNER_TEMP/notes.md"
          else
            echo "::warning::Không có kết quả VirusTotal — ghi chú release không kèm bảng quét."
          fi
          flags=(--draft --verify-tag --title "Sano $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" dist/*

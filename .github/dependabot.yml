# Dependabot: mỗi thứ Hai kiểm thư viện Go, npm và GitHub Actions có bản mới,
# mở PR nâng bản (CI chạy như PR thường). Bản nhỏ/vá gộp chung một PR mỗi nhóm
# cho đỡ ồn; bản lớn (đổi số đầu) tách PR riêng để đọc kỹ trước khi merge.
# Lỗi bảo mật thì Dependabot mở PR ngay, không đợi lịch (cần bật "Dependabot
# security updates" trong Settings → Code security của repo).
#
# Actions đang ghim theo SHA commit: Dependabot tự đổi SHA + chú thích phiên bản.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      go-goc: { update-types: [minor, patch] }

  # Wails: CI cài Wails CLI đúng phiên bản trong desktop/go.mod nên nâng an toàn.
  - package-ecosystem: gomod
    directory: /desktop
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      go-desktop: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /desktop/frontend
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-desktop: { update-types: [minor, patch] }
    ignore:
      # Tailwind 4 đổi cách cấu hình (không còn tailwind.config.ts) → chuyển đổi
      # riêng, có so ảnh giao diện; tailwind-merge 3 chỉ hỗ trợ Tailwind 4.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: tailwind-merge
        update-types: [version-update:semver-major]
      # Kiểu Node theo đúng bản Node dùng build (22 trong CI).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 (bản viết lại bằng Go) bỏ lib/tsc mà vue-tsc cần → build hỏng.
      # Chờ vue-tsc hỗ trợ TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-docs: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(ci)" }
    groups:
      actions: { update-types: [minor, patch] }

  # scripts/tts/requirements.txt chỉ để đối chiếu: sinh từ uv.lock của VieNeu-TTS
  # đúng commit ghim, app cài bằng uv.lock đó. Sửa file này không đổi gì trên máy
  # người dùng và làm hỏng bước kiểm khớp ở tts-smoke → không mở PR cho nó (kể cả
  # PR vá bảo mật). Nâng thư viện Python của bộ đọc làm qua ghim VieNeu + test thật.
  - package-ecosystem: pip
    directory: /scripts/tts
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
